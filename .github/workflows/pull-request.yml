name: Pull Request

on:
  pull_request:

permissions:
  checks: read
  contents: read

jobs:
  checks:
    name: Validate pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run ts-check

  vercel:
    name: Vercel build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const deadline = Date.now() + 20 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha,
              });
              const vercelCheck = data.check_runs.find(
                (check) => check.name === "Vercel"
              );

              if (vercelCheck?.status === "completed") {
                if (vercelCheck.conclusion === "success") return;
                core.setFailed(
                  `Vercel build finished with ${vercelCheck.conclusion ?? "an unknown status"}.`
                );
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            core.setFailed("Timed out waiting for the Vercel build.");
